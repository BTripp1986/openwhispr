# FORK-ONLY, TEST-ONLY. Lives on validation/* branches and must never be merged
# to main or included in an upstream PR. See VALIDATION_BUILD.md.
#
# Produces an unsigned, unpacked Windows test build of the dictation raw/cleaned
# hotkeys candidate so a tester needs no Node, npm, git or build tools. It never
# signs, never publishes and never creates a release.
#
# Push-triggered on purpose: workflow_dispatch needs the workflow registered on
# the repository's default branch, and this one must not touch the fork's main.
# To build a candidate, write the feature SHA into validation/FEATURE_SHA and
# push this branch.

name: Validation Windows Build (fork-only, unsigned)

on:
  push:
    branches:
      - "validation/**"

concurrency:
  # Not cancel-in-progress: a baseline infrastructure smoke build and a later
  # feature candidate are both results worth keeping, and a push that lands
  # while one is running must not discard it.
  group: validation-windows-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Guard (fork-only, packaging-only diff)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      feature_sha: ${{ steps.pin.outputs.feature_sha }}
      label: ${{ steps.pin.outputs.label }}
    steps:
      - name: Refuse to run on the upstream repository
        if: github.repository == 'OpenWhispr/openwhispr'
        run: |
          echo "This workflow is fork-only and must never run on upstream." >&2
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the pinned feature SHA
        id: pin
        run: |
          set -euo pipefail
          raw="$(tr -d ' \t\r\n' < validation/FEATURE_SHA)"
          echo "validation/FEATURE_SHA = '$raw'"
          if [ "$raw" = "BASELINE" ]; then
            # Infrastructure smoke build: no feature code, only this branch's
            # packaging patch on top of the pinned upstream base.
            base="$(tr -d ' \t\r\n' < validation/UPSTREAM_BASE_SHA)"
            echo "feature_sha=$base" >> "$GITHUB_OUTPUT"
            echo "label=baseline-only (NO feature code)" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$raw" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "feature_sha=$raw" >> "$GITHUB_OUTPUT"
            echo "label=feature candidate" >> "$GITHUB_OUTPUT"
          else
            echo "validation/FEATURE_SHA must be a 40-hex SHA or the literal BASELINE" >&2
            exit 1
          fi

      - name: Fetch the pinned commit
        run: |
          set -euo pipefail
          sha='${{ steps.pin.outputs.feature_sha }}'
          git cat-file -e "$sha^{commit}" 2>/dev/null \
            || git fetch --no-tags origin "$sha" \
            || { echo "pinned SHA $sha is not reachable in this repository" >&2; exit 1; }

      - name: Gate — every workflow shell block parses
        shell: bash
        run: |
          set -euo pipefail
          # A quoting mistake in a run: block is otherwise only found by CI
          # itself, after a push that also triggers a Windows build.
          node scripts/validation/check-workflow-shell.js .github/workflows/validation-windows-build.yml

      - name: Gate — the branch adds packaging only
        run: node scripts/validation/check-packaging-only-diff.js '${{ steps.pin.outputs.feature_sha }}'

      - name: Record the packaging diff for review
        run: |
          set -euo pipefail
          mkdir -p validation-out
          git diff '${{ steps.pin.outputs.feature_sha }}..HEAD' > validation-out/packaging-only.diff
          {
            echo '### Validation build guard'
            echo
            echo "- repository: \`${{ github.repository }}\`"
            echo "- build label: **${{ steps.pin.outputs.label }}**"
            echo "- pinned feature SHA: \`${{ steps.pin.outputs.feature_sha }}\`"
            echo "- validation SHA: \`${{ github.sha }}\`"
            echo
            echo '<details><summary>Packaging-only diff (feature SHA -> validation branch)</summary>'
            echo
            echo '```diff'
            head -c 50000 validation-out/packaging-only.diff
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint, typecheck, translations
        run: |
          npm run lint
          npm run typecheck
          npm run i18n:check

      - name: Build better-sqlite3 for the runner's node
        if: ${{ !cancelled() }}
        run: npm rebuild better-sqlite3

      - name: Run the test suite
        if: ${{ !cancelled() }}
        run: npm test
        env:
          ELECTRON_OVERRIDE_DIST_PATH: /tmp
          REQUIRE_DB_TESTS: "1"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-guard
          path: validation-out/
          retention-days: 14

  build-windows:
    name: Unsigned unpacked Windows build
    needs: guard
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: npm ci

      # --no-save: the lockfile must stay byte-identical to upstream's.
      - name: Install platform-specific native binaries
        run: npm install @rollup/rollup-win32-x64-msvc lightningcss-win32-x64-msvc @tailwindcss/oxide-win32-x64-msvc --no-save

      - name: Confirm the lockfile was not modified
        shell: bash
        run: git diff --exit-code -- package-lock.json

      - name: Cache native binaries
        uses: actions/cache@v4
        with:
          path: resources/bin
          key: validation-windows-x64-bin-${{ hashFiles('scripts/download-*.js', 'resources/windows-system-audio-helper.c', 'resources/windows-mic-listener.c', 'resources/windows-key-listener.c') }}

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: validation-windows-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: validation-windows-electron-

      # Deliberately NO "Create runtime env" step: this artifact ships without
      # any of the project's secrets, so electron-builder's extraResources entry
      # for .env matches nothing and the build packages no credentials.
      # electron-builder's extraResources entry is the literal path ".env", which
      # app-builder-lib copies only if that exact file exists (fileMatcher.js
      # copyFiles stats it and warns otherwise) — it never globs ".env.*", and
      # the `files` array does not list any .env path either. The repository
      # tracks .env.example, which carries no values; only a real .env or a
      # local/runtime variant could introduce credentials, so those are refused
      # and the templates are reported.
      - name: Refuse to build if a real .env is present
        shell: bash
        run: |
          set -euo pipefail
          offenders="$(ls -A 2>/dev/null | grep -E '^\.env' | grep -Ev '^\.env\.(example|sample|template)$' || true)"
          templates="$(ls -A 2>/dev/null | grep -E '^\.env\.(example|sample|template)$' || true)"
          if [ -n "$offenders" ]; then
            echo "A real .env is present in the workspace; this artifact must ship without credentials:" >&2
            printf '  %s\n' $offenders >&2
            exit 1
          fi
          echo "no real .env in the workspace${templates:+ (templates ignored: $(echo $templates | tr '\n' ' '))}"

      - name: Build (unsigned, unpacked)
        shell: bash
        run: npm run build:win -- --dir --publish never --config electron-builder.validation-win.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The fork has no GH_TOKEN secret and github.token cannot read the
          # private brand-font release, so the build falls back to Noto Sans.
          BRAND_FONTS_REQUIRED: "0"
          # Unsigned on purpose; electron-builder.validation-win.json also
          # clears forceCodeSigning and the Azure signing options.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Write the build manifest
        shell: bash
        run: |
          set -euo pipefail
          out=dist/win-unpacked
          test -d "$out"
          # Quoted heredoc: the shell performs NO expansion or quote
          # processing on the body, so apostrophes and double quotes in the
          # JS and in BUILD-INFO prose are safe. `node -e '...'` is not.
          node <<'NODE'
            const fs = require("fs");
            const channel = require("./electron-builder.validation-win.json")
              .extraMetadata.openwhisprValidationChannel;
            if (channel !== "development" && channel !== "staging") {
              throw new Error(`refusing to package: openwhisprValidationChannel is ${JSON.stringify(channel)}`);
            }
            const manifest = {
              artifact: "openwhispr-validation-win-unpacked",
              label: process.env.BUILD_LABEL,
              featureSha: process.env.FEATURE_SHA,
              validationSha: process.env.VALIDATION_SHA,
              validationRef: process.env.VALIDATION_REF,
              buildRun: {
                id: process.env.GITHUB_RUN_ID,
                number: process.env.GITHUB_RUN_NUMBER,
                attempt: process.env.GITHUB_RUN_ATTEMPT,
                url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
                workflow: process.env.GITHUB_WORKFLOW,
                repository: process.env.GITHUB_REPOSITORY,
              },
              appVersion: require("./package.json").version,
              builderConfig: "electron-builder.validation-win.json",
              signed: false,
              updatesDisabled: true,
              // Read from the builder config rather than hardcoded: successive
              // candidates pin different channels so each owns a fresh profile
              // and cannot disturb an earlier candidate handed to the same
              // tester. A mismatch here would mis-describe the artifact.
              isolatedChannel: channel,
              userDataPath: `%APPDATA%\\OpenWhispr-${channel}`,
              oauthScheme: channel === "staging" ? "openwhispr-staging" : "openwhispr-dev",
              qdrantIndex: `qdrant-data-validation-${channel}`,
              vaultEntry: `OpenWhispr-validation-${channel}`,
              cliBridgeFile: `cli-bridge-${channel}.json`,
              packagedSecrets: "none",
              builtAt: new Date().toISOString(),
            };
            fs.writeFileSync("dist/win-unpacked/manifest.json", JSON.stringify(manifest, null, 2) + "\n");
            const info = [
              "OpenWhispr validation build",
              "===========================",
              `label           ${manifest.label}`,
              `app version     ${manifest.appVersion}`,
              `feature SHA     ${manifest.featureSha}`,
              `validation SHA  ${manifest.validationSha} (${manifest.validationRef})`,
              `build run       ${manifest.buildRun.url}`,
              `built at        ${manifest.builtAt}`,
              "",
              "signed          no (unsigned test build)",
              "auto-updates    disabled in this build",
              `test profile    ${manifest.userDataPath}`,
              `OAuth scheme    ${manifest.oauthScheme}://`,
              `search index    ${manifest.qdrantIndex}`,
              `vault entry     ${manifest.vaultEntry}`,
              "packaged creds  none",
              "",
              "This candidate owns only the names above. An earlier candidate's",
              "profile, vault entry and search index are never opened.",
              "",
            ].join("\r\n");
            fs.writeFileSync("dist/win-unpacked/BUILD-INFO.txt", info);
          NODE
          cat "$out/BUILD-INFO.txt"
        env:
          BUILD_LABEL: ${{ needs.guard.outputs.label }}
          FEATURE_SHA: ${{ needs.guard.outputs.feature_sha }}
          VALIDATION_SHA: ${{ github.sha }}
          VALIDATION_REF: ${{ github.ref_name }}

      - name: Verify artifact invariants (static inspection only)
        shell: bash
        run: node scripts/validation/verify-windows-test-artifact.js dist/win-unpacked | tee validation-verify.log

      - name: Package the complete directory and hash it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $short = '${{ needs.guard.outputs.feature_sha }}'.Substring(0,12)
          $zip = "openwhispr-validation-win-unpacked-$short.zip"
          Compress-Archive -Path 'dist/win-unpacked/*' -DestinationPath $zip -CompressionLevel Optimal
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $exeHash = (Get-FileHash 'dist/win-unpacked/OpenWhispr.exe' -Algorithm SHA256).Hash.ToLower()
          $zipSize = (Get-Item $zip).Length
          $lines = @(
            "$zipHash  $zip",
            "$exeHash  OpenWhispr.exe"
          )
          $lines | Set-Content -Path 'SHA256SUMS.txt' -Encoding ascii
          "ZIP_NAME=$zip"        | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP_SHA256=$zipHash"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP_BYTES=$zipSize"   | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "EXE_SHA256=$exeHash"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Content 'SHA256SUMS.txt'

      - name: Job summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Unsigned unpacked Windows validation build'
            echo
            echo "- label: **${{ needs.guard.outputs.label }}**"
            echo "- feature SHA: \`${{ needs.guard.outputs.feature_sha }}\`"
            echo "- validation SHA: \`${{ github.sha }}\` (\`${{ github.ref_name }}\`)"
            echo "- build run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- zip: \`${ZIP_NAME:-not produced}\` (${ZIP_BYTES:-0} bytes)"
            echo "- zip sha256: \`${ZIP_SHA256:-n/a}\`"
            echo "- OpenWhispr.exe sha256: \`${EXE_SHA256:-n/a}\`"
            echo
            echo 'Static inspection only. This job launches nothing: it establishes no'
            echo 'claim about global hotkeys, the microphone, clipboard paste or'
            echo 'transcription, all of which need a native Windows run by a human.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the test build
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: openwhispr-validation-win-unpacked
          path: |
            ${{ env.ZIP_NAME }}
            SHA256SUMS.txt
            dist/win-unpacked/manifest.json
            dist/win-unpacked/BUILD-INFO.txt
            validation-verify.log
          retention-days: 14
          if-no-files-found: error

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: validation-windows-failure-logs
          path: |
            validation-verify.log
            dist/builder-debug.yml
            dist/builder-effective-config.yaml
            dist/win-unpacked/manifest.json
            dist/win-unpacked/BUILD-INFO.txt
            npm-debug.log
            resources/bin
          retention-days: 14
          if-no-files-found: ignore
